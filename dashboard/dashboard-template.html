<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dashboard</title>
<!--
  Founder OS: business dashboard template (Level 3). Driven Young Founder OS, licensed to one business (see LICENSE.md).
  White label: the founder's name, colours and pages all come from CONFIG. A page saved in the founder's own Claude
  account; it reads their connected tools with THEIR permissions each time it opens. No keys, no hosting.

  How it is built (for Claude, see dashboard/BLOCKS.md):
    CONFIG.pages   one page per section (Finance, Sales, Marketing...), each a list of blocks.
    CONFIG.sources one entry per tool call. An ADAPTER turns the tool's answer into plain data.
    A block reads that data by path, e.g. "cash.balance" or "pnl.byMonth".
  Only the sources the open page needs are read, so a dashboard can have as many pages as the business needs.
-->
<style>
  :root{--bg:#F7F7F5;--panel:#FFFFFF;--text:#17191E;--muted:#6B6F76;--accent:#2F5BEA;--line:#E6E6E2;
    --good:#1F9D55;--bad:#D64545;--warn:#B7791F;--r:10px;
    --head:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--body:var(--head)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14.5px/1.5 var(--body);-webkit-font-smoothing:antialiased}
  svg.i{width:16px;height:16px;flex:none}
  .shell{display:flex;min-height:100vh}
  .soft{background:color-mix(in srgb,var(--accent) 9%,transparent)}

  aside{width:228px;flex:none;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--panel)}
  .brand{display:flex;align-items:center;gap:11px;padding:18px 18px 20px;color:inherit;text-decoration:none}
  .mark{width:30px;height:30px;border-radius:8px;background:var(--text);color:var(--panel);display:grid;place-items:center;font:700 14px var(--head);overflow:hidden}
  .mark img{width:100%;height:100%;object-fit:cover}
  .brand b{display:block;font:650 14.5px/1.2 var(--head)}
  .brand small{font-size:12px;color:var(--muted)}
  nav{padding:0 10px 20px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
  .grp{font-size:11px;font-weight:600;color:var(--muted);padding:16px 10px 6px;letter-spacing:.02em}
  nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;color:var(--muted);text-decoration:none;font-size:14px}
  nav a:hover{background:color-mix(in srgb,var(--text) 5%,transparent);color:var(--text)}
  nav a.on{background:color-mix(in srgb,var(--text) 7%,transparent);color:var(--text);font-weight:600}
  nav a.on svg{color:var(--accent)}
  .side-foot{margin-top:auto;padding:14px 18px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{position:sticky;top:0;z-index:5;min-height:60px;display:flex;align-items:center;gap:10px;padding:10px 32px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);flex-wrap:wrap}
  .top h1{font:650 18px var(--head);margin:0;flex:1;min-width:140px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--panel)}
  .seg button{border:0;padding:5px 11px;font-size:13px;font-weight:500;color:var(--muted);border-radius:6px}
  .seg button.on{background:var(--text);color:var(--panel)}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:7px 12px;font-weight:550;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
  button:hover{border-color:color-mix(in srgb,var(--text) 22%,transparent)}
  button:active{transform:translateY(1px)}
  button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .demo{font-size:12px;font-weight:600;color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent);border-radius:99px;padding:3px 10px}
  .tabs{display:none}
  .content{padding:28px 32px 64px;max-width:1240px;width:100%;margin:0 auto}
  .intro{color:var(--muted);margin:-6px 0 22px;font-size:14px}
  .grid{display:grid;gap:16px;grid-template-columns:repeat(12,minmax(0,1fr))}
  .w-12{grid-column:span 12}.w-8{grid-column:span 8}.w-6{grid-column:span 6}.w-4{grid-column:span 4}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
  .card-h{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
  .card-h h2{font:600 14px var(--head);margin:0}
  .card-h .note{margin-left:auto;font-size:12px;color:var(--muted)}
  .stats{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
  .stat .l{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px}
  .stat .v{font:650 25px/1.2 var(--head);margin-top:6px;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
  .stat .s{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .up{color:var(--good)!important}.down{color:var(--bad)!important}.acc{color:var(--accent)!important}

  .kv{display:flex;flex-direction:column}
  .kv div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
  .kv div:first-child{border-top:0;padding-top:0}
  .kv b{font-weight:600;font-variant-numeric:tabular-nums}

  .list{display:flex;flex-direction:column}
  .li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
  .li:first-child{border-top:0;padding-top:0}
  .li .t{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .li .sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .li .grow{flex:1;min-width:0}
  .li .amt{font-weight:600;font-variant-numeric:tabular-nums}
  .tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:color-mix(in srgb,var(--text) 6%,transparent);color:var(--muted);white-space:nowrap}
  .tag.good{background:color-mix(in srgb,var(--good) 12%,transparent);color:var(--good)}
  .tag.bad{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
  .tag.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
  .tag.acc{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}

  table{width:100%;border-collapse:collapse;font-size:14px}
  th{font-size:12px;font-weight:550;color:var(--muted);text-align:left;padding:0 10px 10px 0;white-space:nowrap}
  td{padding:10px 10px 10px 0;border-top:1px solid var(--line);white-space:nowrap}
  td:first-child{white-space:normal}
  th.r,td.r{text-align:right}
  td.r,th.r{padding-right:0;padding-left:10px}
  tr.total td{font-weight:650;border-top:1.5px solid color-mix(in srgb,var(--text) 25%,transparent)}
  .scroll{overflow-x:auto;margin:0 -2px;padding:0 2px}
  .scroll td:first-child{white-space:nowrap}.warnbox.top{margin-bottom:16px}
  .dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:8px;vertical-align:0}

  .bars{display:flex;flex-direction:column;gap:13px}
  .bars .lbl{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;margin-bottom:5px}
  .bars .lbl b{font-weight:600;font-variant-numeric:tabular-nums}
  .bar{height:7px;border-radius:99px;background:color-mix(in srgb,var(--text) 7%,transparent);overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}

  .funnel{display:flex;flex-direction:column;gap:6px}
  .fr{display:grid;grid-template-columns:120px 1fr 90px;gap:14px;align-items:center}
  .fr .fl{font-size:12.5px;color:var(--muted)}
  .fr .fb{display:flex;justify-content:center}
  .fr .fb i{display:grid;place-items:center;height:34px;border-radius:6px;background:var(--accent);color:#fff;font:650 14px var(--head);font-style:normal;min-width:44px;font-variant-numeric:tabular-nums}
  .fr .fc{text-align:right;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
  .fr .fc small{display:block;font-size:11px;color:var(--muted);font-weight:400}
  .fconv{font-size:11.5px;color:var(--muted);text-align:center;margin-left:134px;margin-right:104px}

  .chart svg{width:100%;height:auto;display:block;overflow:visible}
  .chart text{font:11px var(--body);fill:var(--muted)}
  .legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);margin-top:10px}

  .goal h3{font:600 15px/1.35 var(--head);margin:0}
  .goal-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
  .goal .lbl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;color:var(--muted)}
  .goal .lbl b{color:var(--text);font-variant-numeric:tabular-nums}

  .day{display:flex;gap:16px;padding:11px 0;border-top:1px solid var(--line)}
  .day:first-child{border-top:0;padding-top:0}
  .date{width:48px;flex:none;text-align:center;border-radius:8px;padding:5px 0;background:color-mix(in srgb,var(--text) 5%,transparent)}
  .date.today{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
  .date b{display:block;font:650 18px/1.1 var(--head)}
  .date span{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
  .evs{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;justify-content:center}
  .ev{display:flex;gap:12px;font-size:14px}
  .ev .tm{width:62px;flex:none;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
  .ev .tt{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .text{font-size:14px;color:var(--muted);margin:0}
  .warnbox{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:12px 14px;margin-top:10px}
  .warnbox button{margin-top:8px}
  .skel{height:13px;border-radius:6px;background:linear-gradient(90deg,var(--line),color-mix(in srgb,var(--line) 40%,var(--panel)),var(--line));background-size:200% 100%;animation:sh 1.4s infinite;margin:8px 0}
  @keyframes sh{to{background-position:-200% 0}}
  .empty{font-size:13.5px;color:var(--muted)}
  [hidden]{display:none!important}

  @media(max-width:1000px){.w-8,.w-6,.w-4{grid-column:span 12}}
  @media(max-width:860px){aside{display:none}.top{padding:10px 16px}.content{padding:16px 16px 48px}
    .tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel);scrollbar-width:none}
    .tabs a{flex:none;font-size:13.5px;padding:6px 12px;border-radius:99px;color:var(--muted);text-decoration:none;border:1px solid var(--line)}
    .tabs a.on{background:var(--text);color:var(--panel);border-color:var(--text)}
    .fr{grid-template-columns:86px 1fr 70px;gap:8px}.fconv{margin-left:94px;margin-right:78px}}
  @media(max-width:520px){.stats{grid-template-columns:1fr 1fr;gap:10px}.stat{padding:13px 14px}.stat .v{font-size:20px}.top .seg button{padding:5px 8px}}
  @media(prefers-reduced-motion:reduce){.skel{animation:none}}
</style>
</head>
<body>
<div class="shell">
  <aside>
    <a class="brand" href="#/">
      <span class="mark" id="mark"></span>
      <span><b id="bizName"></b><small>Dashboard</small></span>
    </a>
    <nav id="nav"></nav>
    <div class="side-foot">Reads your tools only. Nothing is sent or changed.</div>
  </aside>
  <div class="main">
    <header class="top">
      <h1 id="title"></h1>
      <span class="demo" id="demoTag" hidden>Example data</span>
      <div class="seg" id="periods" role="group" aria-label="Period"></div>
      <button id="refresh" type="button"><svg class="i" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor"><path d="M224,48V96a8,8,0,0,1-8,8H168a8,8,0,0,1,0-16h28.69L182.06,73.37a79.56,79.56,0,0,0-56.13-23.43h-.45A79.52,79.52,0,0,0,69.59,72.71,8,8,0,0,1,58.41,61.27a96,96,0,0,1,135,.79L208,76.69V48a8,8,0,0,1,16,0ZM186.41,183.29a80,80,0,0,1-112.47-.66L59.31,168H88a8,8,0,0,0,0-16H40a8,8,0,0,0-8,8v48a8,8,0,0,0,16,0V179.31l14.63,14.63A95.43,95.43,0,0,0,130,222.06h.53a95.36,95.36,0,0,0,67.07-27.33,8,8,0,0,0-11.18-11.44Z"/></svg>Refresh</button>
    </header>
    <div class="tabs" id="tabs"></div>
    <main class="content" id="page"></main>
  </div>
</div>

<!-- CONFIG: Claude fills this from the founder's dashboard map. JSON only. See dashboard/BLOCKS.md. -->
<script type="application/json" id="config">
{
  "business": "EXAMPLE Studio",
  "logo": null,
  "demo": true,
  "currency": "AUD",
  "brand": { "bg": "#F7F7F5", "panel": "#FFFFFF", "text": "#17191E", "muted": "#6B6F76", "accent": "#2F5BEA", "line": "#E6E6E2" },
  "periods": ["month", "quarter", "year"],
  "sources": {
    "cash":     { "server": "Xero", "tool": "get_cash_position", "input": { "organisation_id": "ORG_ID" }, "adapter": "xeroCash" },
    "pnl":      { "server": "Xero", "tool": "get_profit_and_loss", "input": { "organisation_id": "ORG_ID", "start_date": "{from}", "end_date": "{to}", "comparison_start_date": "{prevFrom}", "comparison_end_date": "{prevTo}" }, "adapter": "xeroPnl" },
    "owed":     { "server": "Xero", "tool": "get_aged_receivables", "input": { "organisation_id": "ORG_ID" }, "adapter": "xeroReceivables" },
    "bills":    { "server": "Xero", "tool": "get_aged_payables", "input": { "organisation_id": "ORG_ID" }, "adapter": "xeroPayables" },
    "deals":    { "server": "GHL", "tool": "opportunities_search-opportunity", "input": { "query_status": "open", "query_limit": 100 }, "adapter": "ghlOpportunities" },
    "won":      { "server": "GHL", "tool": "opportunities_search-opportunity", "input": { "query_status": "won", "query_limit": 100, "query_date": "{from}", "query_endDate": "{to}" }, "adapter": "ghlWon" },
    "pnl12":    { "server": "Xero", "tool": "get_profit_and_loss", "input": { "organisation_id": "ORG_ID", "start_date": "{yearAgo}", "end_date": "{today}" }, "adapter": "xeroPnl" },
    "customers": { "server": "GHL", "tool": "opportunities_search-opportunity", "input": { "query_status": "won", "query_limit": 1, "query_date": "{yearAgo}", "query_endDate": "{today}" }, "adapter": "ghlCount" },
    "unit":     { "derive": "unitEconomics", "from": { "revenue": "pnl12.income", "customers": "customers.count", "newCustomers": "won.count", "marketing": "pnl.marketing" } },
    "funnel":   { "server": "", "tool": "", "input": {}, "adapter": "" },
    "spend":    { "server": "", "tool": "", "input": {}, "adapter": "" },
    "calendar": { "server": "Google Calendar", "tool": "list_events", "input": { "pageSize": 50, "orderBy": "startTime", "startTime": "{now}", "endTime": "{in7days}" }, "adapter": "googleCalendar" }
  },
  "pages": [
    { "id": "overview", "title": "Overview", "icon": "house",
      "blocks": [
        { "type": "stats", "items": [
          { "label": "Cash in the bank", "value": "cash.balance", "format": "money", "sub": "Across all accounts" },
          { "label": "Money in", "value": "pnl.income", "format": "money", "change": "pnl.incomeChange" },
          { "label": "Profit", "value": "pnl.profit", "format": "money", "tone": "sign", "sub": "pnl.marginText" },
          { "label": "In the pipeline", "value": "deals.value", "format": "money", "sub": "deals.openText" } ] },
        { "type": "list", "title": "Needs you", "data": "deals.followUps", "width": 6, "empty": "Nobody waiting on you." },
        { "type": "week", "title": "Next 7 days", "data": "calendar", "width": 6 } ] },

    { "id": "finance", "title": "Finance", "icon": "wallet", "group": "Business",
      "blocks": [
        { "type": "stats", "items": [
          { "label": "Money in", "value": "pnl.income", "format": "money", "change": "pnl.incomeChange" },
          { "label": "Money out", "value": "pnl.spend", "format": "money", "change": "pnl.spendChange", "invert": true },
          { "label": "Profit", "value": "pnl.profit", "format": "money", "tone": "sign", "sub": "pnl.marginText" },
          { "label": "Real cash", "value": "cash.real", "format": "money", "sub": "Bank + owed to you − bills" } ] },
        { "type": "stats", "items": [
          { "label": "LTV", "value": "unit.ltv", "format": "money", "sub": "Per customer, last 12 months" },
          { "label": "CAC", "value": "unit.cac", "format": "money", "sub": "unit.cacText" },
          { "label": "LTV:CAC", "value": "unit.ratio", "format": "ratio", "tone": "atLeast", "good": 3, "sub": "unit.ratioText" },
          { "label": "New customers", "value": "unit.newCustomers", "format": "number", "sub": "This period" } ] },
        { "type": "chart", "title": "Money in and out by month", "data": "pnl.byMonth", "format": "money", "width": 12 },
        { "type": "list", "title": "Owed to you", "data": "owed.items", "total": "owed.total", "format": "money", "width": 6, "empty": "Nobody owes you anything." },
        { "type": "list", "title": "You owe", "data": "bills.items", "total": "bills.total", "format": "money", "width": 6, "empty": "You don't owe anything right now." },
        { "type": "bars", "title": "Spend by category", "data": "pnl.byCategory", "format": "money", "width": 12 } ] },

    { "id": "sales", "title": "Sales", "icon": "handshake", "group": "Growth",
      "blocks": [
        { "type": "stats", "items": [
          { "label": "Open deals", "value": "deals.open", "format": "number" },
          { "label": "In the pipeline", "value": "deals.value", "format": "money" },
          { "label": "Need a follow-up", "value": "deals.followUpCount", "format": "number", "tone": "accent" },
          { "label": "Won this period", "value": "won.value", "format": "money", "sub": "won.countText" } ] },
        { "type": "bars", "title": "Pipeline by stage", "data": "deals.byStage", "format": "money", "width": 6 },
        { "type": "list", "title": "Follow up", "data": "deals.followUps", "width": 6, "empty": "Everyone is up to date." },
        { "type": "table", "title": "All open deals", "data": "deals.table", "width": 12 } ] },

    { "id": "marketing", "title": "Marketing", "icon": "megaphone", "group": "Growth",
      "blocks": [
        { "type": "funnel", "title": "Funnel", "data": "funnel.steps", "width": 8, "format": "money", "costLabel": "per result" },
        { "type": "kv", "title": "Spend and return", "data": "funnel.summary", "width": 4 },
        { "type": "chart", "title": "Marketing spend", "data": "spend.byMonth", "format": "money", "stacked": true, "width": 12, "table": true } ] },

    { "id": "operations", "title": "Operations", "icon": "calendar-blank", "group": "Running",
      "blocks": [
        { "type": "week", "title": "This week", "data": "calendar", "width": 8 },
        { "type": "list", "title": "Tasks due", "data": "calendar.tasks", "width": 4, "empty": "No tasks due." } ] },

    { "id": "goals", "title": "Goals", "icon": "target", "group": "Running",
      "blocks": [ { "type": "goals" } ] }
  ],
  "goals": [
    { "title": "EXAMPLE: 20 new clients this quarter", "current": 11, "goal": 20, "target": "9 more by 31 March", "status": "on_track" },
    { "title": "EXAMPLE: $60k revenue this quarter", "current": 28400, "goal": 60000, "money": true, "target": "Need $3.2k a week", "status": "behind" },
    { "title": "EXAMPLE: hire a second designer", "target": "Ad goes live in December", "status": "not_started" }
  ]
}
</script>

<script>
/* ADAPTERS: turn a tool's answer into plain data that blocks read by path. Claude writes one per tool, after
   looking at one real answer from that tool in the founder's own session (shape only, never their data).
   Block shapes (see dashboard/BLOCKS.md):
     stats/kv value  -> a number or text
     list            -> [{title, sub, value, tag, tone}]
     bars            -> [{label, value}]
     chart           -> {labels:[...], series:[{name, values:[...]}]}
     table           -> {columns:[{label, align, format}], rows:[[...]], total:[...]}
     funnel          -> [{label, value, cost}]
     week            -> {events:[{title, start, end, allDay}], tasks:[...list items]}           */
const num = (v) => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
const ADAPTERS = {
  // Xero get_cash_position. Checked 25 Nov 2026: amount_owed = owed to you, amount_due = you owe.
  xeroCash(p) { if (p?.cash_balance === undefined) throw new Error('shape'); const b = num(p?.cash_balance), o = num(p?.amount_owed), d = num(p?.amount_due); return { balance: b, owedToYou: o, youOwe: d, real: b + o - d }; },
  // Xero get_profit_and_loss for the chosen period. Checked 26 Nov 2026: current_pnl, comparison_pnl, expense_accounts.all_accounts[{account_name, current_balance}]. Money in and out by month needs one call per month: not filled here.
  xeroPnl(p) {

  unitEconomics(raw) {

  const s = store[key]; if (!s?.err) return null; const src = CFG.sources?.[s.err.from || key] || {}; const name = src.server || 'this tool';
  const say = {
    not_set_up: 'Not connected yet. Ask Claude: "add this to my dashboard".',
    no_claude: 'Open this dashboard in Claude to see your live numbers.',
    needs_reauth: `${name} needs reconnecting. In Claude: Settings, then Connectors, then ${name}.`,
    server_not_connected: `${name} isn't connected. Ask Claude: "connect ${name}", then press Connect.`,
    selection_required: `You have more than one ${name} connected. Choose one when Claude asks.`,
    not_in_manifest: `${name} is switched off for this dashboard. Turn it on in this page's permissions menu.`,
    blocked_by_policy: `${name} is blocked by your organisation's settings.`,
    approval_required: `This needs your OK to read ${name}.`,
    adapter: `${name} answered in a way this block doesn't understand yet. Ask Claude to fix it.`,
  }[s.err.code] || `Couldn't load from ${name} just now. Press Refresh to try again.`;
  const box = el('div', 'warnbox', say);

}

/* BLOCKS: each draws into its own card. Add a new kind by adding a function here (see BLOCKS.md). */
const card = (b) => { const c = el('section', 'card'); if (b.title) { const h = el('div', 'card-h'); h.append(el('h2', null, b.title)); if (b.note) h.append(el('span', 'note', b.note)); c.append(h); } return c; };
const tone = (it, v) => v == null ? '' : it.tone === 'sign' ? (num(v) >= 0 ? 'up' : 'down') : it.tone === 'accent' ? 'acc' : it.tone === 'atLeast' ? (num(v) >= num(it.good) ? 'up' : 'down') : '';
const BLOCKS = {
  stats(b, box) {
    const wrap = el('div', 'stats');
    for (const it of b.items || []) {
      const v = get(it.value), s = el('div', 'stat'), l = el('div', 'l'); if (it.icon) l.append(icon(it.icon)); l.append(el('span', null, it.label));
      const val = el('div', `v ${tone(it, v)}`, v === undefined ? (store[keyOf(it.value)]?.err ? '–' : '…') : fmt(v, it.format));
      let sub = '';
      const ch = get(it.change);
      if (Number.isFinite(ch)) { const good = it.invert ? ch <= 0 : ch >= 0; sub = el('div', `s ${good ? 'up' : 'down'}`, `${ch >= 0 ? '+' : ''}${ch}% on last period`); }
      else { const t = it.sub && (it.sub.includes('.') && keyOf(it.sub) in (CFG.sources || {}) ? get(it.sub) : it.sub); sub = el('div', 's', t || ' '); }
      s.append(l, val, sub); wrap.append(s);
    }
    box.append(wrap);
  },
  kv(b, box) { const c = card(b), list = el('div', 'kv'); for (const it of get(b.data) || b.items || []) { const r = el('div'); r.append(el('span', null, it.label), el('b', null, fmt(it.value?.toString().includes?.('.') && keyOf(it.value) in (CFG.sources || {}) ? get(it.value) : it.value, it.format))); list.append(r); } c.append(list.children.length ? list : el('p', 'empty', b.empty || 'Nothing yet.')); box.append(c); },
  list(b, box) {
    const c = card(b); const items = get(b.data) || [];
    if (b.total) { const h = c.querySelector('.card-h') || c; const t = el('span', 'note', fmt(get(b.total), b.format || 'money')); t.style.cssText = 'font-size:15px;font-weight:650;color:var(--text)'; h.append(t); }
    const list = el('div', 'list');
    for (const it of items.slice(0, b.limit || 8)) {
      const r = el('div', 'li'), g = el('div', 'grow'); g.append(el('div', 't', it.title)); if (it.sub) g.append(el('div', 'sub', it.sub)); r.append(g);
      if (it.value != null && it.value !== '') r.append(el('span', 'amt', fmt(it.value, b.format || 'money')));
      if (it.tag) r.append(el('span', `tag ${it.tone || ''}`, it.tag));
      list.append(r);
    }
    c.append(items.length ? list : el('p', 'empty', b.empty || 'Nothing here.'));
    if (items.length > (b.limit || 8)) c.append(el('p', 'empty', `+ ${items.length - (b.limit || 8)} more`));
    box.append(c);
  },
  bars(b, box) {
    const c = card(b), rows = (get(b.data) || []).slice().sort((x, y) => num(y.value) - num(x.value)).slice(0, b.limit || 8);
    const max = Math.max(...rows.map((r) => num(r.value)), 1), wrap = el('div', 'bars');
    for (const r of rows) { const w = el('div'), l = el('div', 'lbl'); l.append(el('span', null, r.label), el('b', null, fmt(r.value, b.format))); const bar = el('div', 'bar'), i = el('i'); i.style.width = `${num(r.value) / max * 100}%`; bar.append(i); w.append(l, bar); wrap.append(w); }
    c.append(rows.length ? wrap : el('p', 'empty', b.empty || 'Nothing yet.')); box.append(c);
  },
  table(b, box) {
    const c = card(b), t = get(b.data); if (!t?.rows?.length) { c.append(el('p', 'empty', b.empty || 'Nothing yet.')); box.append(c); return; }
    const tbl = el('table'), hr = el('tr');
    for (const col of t.columns) hr.append(el('th', col.align === 'r' ? 'r' : null, col.label));
    tbl.append(hr);
    const row = (cells, cls) => { const tr = el('tr', cls); cells.forEach((v, i) => { const col = t.columns[i] || {}; const td = el('td', col.align === 'r' ? 'r' : null); if (i === 0 && t.colors?.[cells.__i]) { const d = el('span', 'dot'); d.style.background = t.colors[cells.__i]; td.append(d); } td.append(document.createTextNode(fmt(v, col.format))); tr.append(td); }); tbl.append(tr); };
    t.rows.slice(0, b.limit || 50).forEach((r, i) => { r.__i = i; row(r); });
    if (t.total) row(t.total, 'total');
    const s = el('div', 'scroll'); s.append(tbl); c.append(s); box.append(c);
  },
  funnel(b, box) {
    const c = card(b), steps = get(b.data) || []; if (!steps.length) { c.append(el('p', 'empty', 'Nothing yet.')); box.append(c); return; }
    const max = Math.max(...steps.map((s) => num(s.value)), 1), f = el('div', 'funnel');
    steps.forEach((s, i) => {
      if (i) { const prev = num(steps[i - 1].value); f.append(el('div', 'fconv', prev ? `${Math.round(num(s.value) / prev * 100)}% of ${steps[i - 1].label.toLowerCase()}` : '')); }
      const r = el('div', 'fr'), fb = el('div', 'fb'), bar = el('i', null, fmt(s.value, 'number'));
      bar.style.width = `${Math.max(8, num(s.value) / max * 100)}%`; bar.style.opacity = String(1 - i * 0.12); fb.append(bar);
      const cost = el('div', 'fc'); if (s.cost != null) { cost.append(document.createTextNode(fmt(s.cost, b.format || 'money'))); cost.append(el('small', null, b.costLabel || 'each')); }
      r.append(el('div', 'fl', s.label), fb, cost); f.append(r);
    });
    c.append(f); box.append(c);
  },
  chart(b, box) {
    const c = card(b), d = get(b.data); if (!d?.labels?.length) { c.append(el('p', 'empty', b.empty || 'Nothing yet.')); box.append(c); return; }
    const NS = 'http://www.w3.org/2000/svg', W = Math.max(300, (box.clientWidth || 760) - 42), H = W < 500 ? 180 : 230, L = 46, B = 22, T = 8;
    const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', b.title || 'Chart');
    const n = d.labels.length, series = d.series || [];
    const totals = d.labels.map((_, i) => b.stacked ? series.reduce((s, x) => s + num(x.values[i]), 0) : Math.max(...series.map((x) => num(x.values[i]))));
    const raw = Math.max(...totals, 1) / 3, mag = Math.pow(10, Math.floor(Math.log10(raw))), step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((m) => m >= raw), max = step * 3;
    const y = (v) => T + (H - B - T) * (1 - v / max);
    const mk = (tag, a) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(a)) e.setAttribute(k, v); return e; };
    for (let g = 0; g <= 3; g++) { const v = step * g, yy = y(v); svg.append(mk('line', { x1: L, x2: W, y1: yy, y2: yy, stroke: 'var(--line)' })); const t = mk('text', { x: L - 8, y: yy + 4, 'text-anchor': 'end' }); t.textContent = short(v, b.format); svg.append(t); }
    const slot = (W - L) / n, groupW = slot * 0.64, barW = b.stacked ? groupW : groupW / series.length;
    d.labels.forEach((lab, i) => {
      let base = 0; const x0 = L + slot * i + (slot - groupW) / 2;
      series.forEach((s, si) => { const v = num(s.values[i]); const x = b.stacked ? x0 : x0 + si * barW;
        const top = b.stacked ? y(base + v) : y(v), bottom = b.stacked ? y(base) : y(0);
        const r = mk('rect', { x, y: top, width: Math.max(1, barW - (b.stacked ? 0 : 3)), height: Math.max(0, bottom - top), rx: 3, fill: PALETTE[si % PALETTE.length] });
        const tt = document.createElementNS(NS, 'title'); tt.textContent = `${s.name}, ${lab}: ${fmt(v, b.format)}`; r.append(tt); svg.append(r); if (b.stacked) base += v; });
      if (slot >= 34 || i % 2 === 0) { const t = mk('text', { x: L + slot * i + slot / 2, y: H - 5, 'text-anchor': 'middle' }); t.textContent = lab; svg.append(t); }
    });
    const wrap = el('div', 'chart'); wrap.append(svg);
    const lg = el('div', 'legend'); series.forEach((s, i) => { const k = el('span'), dot = el('span', 'dot'); dot.style.background = PALETTE[i % PALETTE.length]; k.append(dot, document.createTextNode(s.name)); lg.append(k); });
    c.append(wrap, lg);
    if (b.table) {
      const cols = [{ label: b.tableLabel || '' }, ...d.labels.map((l) => ({ label: l, align: 'r', format: b.format }))];
      const rows = series.map((s) => [s.name, ...s.values]);
      const total = series.length > 1 ? ['Total', ...d.labels.map((_, i) => series.reduce((a, s) => a + num(s.values[i]), 0))] : null;
      const tb = { columns: cols, rows, total, colors: series.map((_, i) => PALETTE[i % PALETTE.length]) };
      const holder = el('div'); holder.style.marginTop = '18px'; const fake = '__chart'; store[fake] = { data: tb };
      BLOCKS.table({ data: fake }, holder); const inner = holder.querySelector('.scroll'); if (inner) { inner.style.marginTop = '18px'; c.append(inner); } delete store[fake];
    }
    box.append(c);
  },
  week(b, box) {
    const c = card(b), d = get(b.data) || {}; const evs = (d.events || []).slice().sort((a, x) => when(a.start) - when(x.start)), byDay = new Map();
    for (const e of evs) { const day = when(e.start), k = ymd(day); if (!byDay.has(k)) byDay.set(k, { day, items: [] }); byDay.get(k).items.push(e); }
    const today = ymd(new Date()), wrap = el('div');
    for (const { day, items } of [...byDay.values()].slice(0, b.limit || 7)) {
      const row = el('div', 'day'), dt = el('div', ymd(day) === today ? 'date today' : 'date');
      dt.append(el('span', null, ymd(day) === today ? 'Today' : day.toLocaleDateString('en-AU', { weekday: 'short' })), el('b', null, day.getDate()));
      const list = el('div', 'evs'); for (const e of items) { const r = el('div', 'ev'); r.append(el('span', 'tm', e.allDay ? 'All day' : time(when(e.start))), el('span', 'tt', e.title)); list.append(r); }
      row.append(dt, list); wrap.append(row);
    }
    c.append(wrap.children.length ? wrap : el('p', 'empty', b.empty || 'Nothing booked.')); box.append(c);
  },
  goals(_b, box) {
    const goals = CFG.goals || [], grid = el('div', 'grid');
    const label = { on_track: ['On track', 'good'], behind: ['Behind', 'bad'], done: ['Done', 'good'], not_started: ['Not started', ''] };
    if (!goals.length) { const c = card({}); c.append(el('p', 'empty', 'No goals yet. Ask Claude: "add my goals to my dashboard".')); box.append(c); return; }
    for (const g of goals) {
      const c = el('section', 'card goal w-4'), top = el('div', 'goal-top'); const [t, cls] = label[g.status] || label.not_started;
      top.append(el('h3', null, g.title), el('span', `tag ${cls}`, t)); c.append(top);
      const has = num(g.goal) > 0, pct = g.status === 'done' ? 100 : has ? num(g.current) / num(g.goal) * 100 : 0;
      if (has || g.status === 'done') { const l = el('div', 'lbl'); l.append(el('span', null, 'Progress'), el('b', null, has ? `${fmt(g.current, g.money ? 'money' : 'number')} / ${fmt(g.goal, g.money ? 'money' : 'number')}` : 'Complete'));
        const bar = el('div', 'bar'), i = el('i'); i.style.width = `${Math.min(100, pct)}%`; if (g.status === 'behind') i.style.background = 'var(--bad)'; bar.append(i); c.append(l, bar); }
      if (g.target) { const p = el('p', 'empty', g.target); p.style.margin = '10px 0 0'; c.append(p); }
      grid.append(c);
    }
    box.append(grid);
  },
  text(b, box) { const c = card(b); c.append(el('p', 'text', b.text || '')); box.append(c); },
};
const PATHS = { stats: (b) => (b.items || []).flatMap((i) => [i.value, i.change, i.sub]), kv: (b) => [b.data, ...(b.items || []).map((i) => i.value)], list: (b) => [b.data, b.total] };
const blockKeys = (b) => [...new Set((PATHS[b.type] ? PATHS[b.type](b) : [b.data]).filter((p) => typeof p === 'string' && keyOf(p) in (CFG.sources || {})).map(keyOf))];

// Show a page
// One note at the top when the page is opened outside Claude, instead of one per block
function banner() { const host = $('page'); if (host.querySelector('.warnbox.top')) return; const b = el('div', 'warnbox top', 'Open this dashboard in Claude to see your live numbers.'); host.prepend(b); }
function show() {
  const id = (location.hash.replace(/^#\/?/, '') || PAGES[0]?.id || '').split('?')[0];
  const page = PAGES.find((p) => p.id === id) || PAGES[0]; if (!page) return;
  drawNav(page.id); $('title').textContent = page.title; document.title = `${page.title} · ${biz}`;
  for (const k of Object.keys(waiting)) delete waiting[k];
  const host = $('page'); host.replaceChildren();
  if (page.intro) host.append(el('p', 'intro', page.intro));
  const grid = el('div', 'grid'); host.append(grid); const keys = new Set();
  for (const b of page.blocks || []) {
    if (!BLOCKS[b.type]) continue;
    const slot = el('div', `w-${[4, 6, 8, 12].includes(b.width) ? b.width : 12}`); grid.append(slot);
    const ks = blockKeys(b); ks.forEach((k) => keys.add(k));
    const draw = () => {
      slot.replaceChildren();
      const pending = ks.filter((k) => !store[k]);
      if (pending.length && b.type !== 'stats') { const c = card(b); for (const w of [60, 90, 72]) { const s = el('div', 'skel'); s.style.width = w + '%'; c.append(s); } slot.append(c); return; }
      const broken = ks.filter((k) => store[k]?.err);
      if (broken.length && b.type !== 'stats') { const c = card(b); slot.append(c); if (broken.every((k) => store[k].err.code === 'no_claude')) c.append(el('p', 'empty', '–')); }
      else BLOCKS[b.type](b, slot);
      const target = slot.querySelector('.card') || slot, said = new Set();
      for (const k of broken) { if (store[k].err.code === 'no_claude') { banner(); continue; } const p = problem(k); if (p && !said.has(p.textContent)) { said.add(p.textContent); target.append(p); } }
    };
    need(ks, draw); draw();
  }
  for (const k of keys) delete store[k];
  for (const k of keys) for (const f of waiting[k] || []) f();
  connect([...keys]);
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', show);
let rz = null, lastW = innerWidth;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (Math.abs(innerWidth - lastW) < 40) return; lastW = innerWidth; for (const fs of Object.values(waiting)) fs.forEach((f) => f()); }, 200); });
$('refresh').addEventListener('click', async () => { if (mcp) { try { await mcp.invalidate(); } catch { /* nothing cached */ } } else show(); });
drawPeriods(); show();
</script>
