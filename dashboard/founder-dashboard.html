<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Founder dashboard</title>
<!--
  Founder OS: founder dashboard (Level 3). Driven Young Founder OS, licensed to one business (see LICENSE.md).
  A page saved in the founder's own Claude account. Each time they open it, it reads their connected tools
  (CRM, calendar, accounting) with THEIR permissions: no keys, no hosting, private to them.
  Claude fills the CONFIG block below (business, brand, modules, sources, goals) and, where a founder's tool
  answers in a different shape, the ADAPTERS. Everything else stays as it is.
  Layout: sidebar, a strip of headline numbers, three "needs you" cards, then one section per module.
  Modules: leads (CRM), week (calendar + tasks), money (accounting), goals (from the AI brain).
-->
<style>
  :root{--bg:#111214;--panel:#191A1D;--text:#F3F3F1;--muted:#9C9EA4;--accent:#E8893F;
    --line:color-mix(in srgb,var(--text) 9%,transparent);--panel2:color-mix(in srgb,var(--text) 4%,var(--panel));
    --soft:color-mix(in srgb,var(--accent) 14%,transparent);--good:#8BC34A;--warn:#F2B544;--bad:#EF6F5E;--r:10px;
    --head:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--body:var(--head)}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth;scroll-padding-top:72px}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
  svg.i{width:16px;height:16px;flex:none}
  .shell{display:flex;min-height:100vh}

  /* Sidebar */
  aside{width:232px;flex:none;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:color-mix(in srgb,var(--bg) 70%,var(--panel))}
  .brand{display:flex;align-items:center;gap:12px;padding:18px 18px 22px}
  .mark{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--bg);display:grid;place-items:center;font:700 15px var(--head)}
  .brand b{display:block;font:700 15px/1.2 var(--head)}
  .eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  nav{padding:0 10px;display:flex;flex-direction:column;gap:18px}
  nav .eyebrow{padding:0 10px 6px;display:block}
  nav .eyebrow::before{content:"";display:inline-block;width:10px;height:2px;background:var(--accent);vertical-align:middle;margin-right:8px;border-radius:2px}
  nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;color:var(--muted);text-decoration:none;font-size:14px;border-left:2px solid transparent}
  nav a:hover{background:var(--line);color:var(--text)}
  nav a.on{background:var(--soft);color:var(--text);font-weight:600;border-left-color:var(--accent)}
  nav a .count{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--warn);color:#111;font-size:11px;font-weight:700;display:grid;place-items:center}
  .side-foot{margin-top:auto;padding:16px 20px;font-size:12px;color:var(--muted)}

  /* Top bar */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{position:sticky;top:0;z-index:5;height:58px;display:flex;align-items:center;gap:10px;padding:0 28px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px)}
  .top h1{font:700 18px var(--head);margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top h1 small{font:400 13px var(--body);color:var(--muted);margin-left:10px}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--text);padding:8px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
  button:hover{background:var(--line)}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
  button.primary:hover{filter:brightness(1.08)}
  button:active{transform:translateY(1px)}
  button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .demo{font-size:12px;font-weight:600;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:99px;padding:3px 10px}
  .content{padding:28px;max-width:1280px;width:100%;margin:0 auto;padding-bottom:56px;display:flex;flex-direction:column;gap:28px}

  /* Cards */
  .card{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
  a.card{color:inherit;text-decoration:none;display:block;transition:border-color .15s}
  a.card:hover{border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
  .row4{display:grid;gap:14px;grid-template-columns:repeat(4,1fr)}
  .row3{display:grid;gap:14px;grid-template-columns:repeat(3,1fr)}
  .stat .eyebrow::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--accent);margin-right:8px;vertical-align:0}
  .stat .v{font:700 26px/1.15 var(--head);margin-top:8px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat .s,.meta{font-size:13px;color:var(--muted)}
  .hl,a.card.hl{display:flex;gap:12px;align-items:flex-start}
  .hl .t{font-size:14px;font-weight:600;color:var(--muted)}
  .hl .v{font:700 26px/1.2 var(--head);color:var(--accent);margin-top:4px}
  .hl .grow{flex:1;min-width:0}
  .tile{width:34px;height:34px;border-radius:8px;background:var(--soft);color:var(--accent);display:grid;place-items:center;flex:none}

  /* Sections */
  section.mod{display:flex;flex-direction:column;gap:14px}
  .mod-head{display:flex;align-items:center;gap:10px}
  .mod-head h2{font:700 18px var(--head);margin:0;display:flex;align-items:center;gap:10px}
  .pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:6px;background:var(--line);color:var(--text)}
  .fresh{margin-left:auto;font-size:12px;color:var(--muted)}
  .chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:6px;border:1px solid var(--line);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
  .chip.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 35%,transparent);background:color-mix(in srgb,var(--good) 8%,transparent)}
  .chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent);background:color-mix(in srgb,var(--warn) 8%,transparent)}
  .chip.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent);background:color-mix(in srgb,var(--bad) 8%,transparent)}
  .chip.acc{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent);background:var(--soft)}
  .bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s ease}
  .bar.warn>i{background:var(--bad)}
  .split{display:grid;gap:14px;grid-template-columns:3fr 2fr;align-items:start}

  /* Leads table */
  .rows{display:flex;flex-direction:column}
  .r{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 110px 110px 96px;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
  .r:first-child{border-top:0}
  .r.h{padding-top:0;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .r .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .r .num{font-variant-numeric:tabular-nums;text-align:right}
  .r>:last-child{justify-self:end}
  .stage{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* Week */
  .day{display:flex;gap:16px;padding:12px 0;border-top:1px solid var(--line)}
  .day:first-of-type{border-top:0;padding-top:2px}
  .date{width:54px;flex:none;text-align:center;border-radius:8px;padding:6px 0;background:var(--line)}
  .date.today{background:var(--soft);color:var(--accent)}
  .date b{display:block;font:700 20px/1.1 var(--head)}
  .date span{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
  .evs{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;justify-content:center}
  .ev{display:flex;gap:12px;font-size:14px;align-items:baseline}
  .ev .tm{width:66px;flex:none;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
  .ev .tt{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .task{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
  .task:first-of-type{border-top:0}
  .box{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--muted);flex:none}
  .sub-h{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:2px 0 6px}

  /* Money */
  .flow{display:flex;flex-direction:column;gap:14px}
  .flow .lbl{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:6px}
  .foot3{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
  .foot3 .meta{font-size:12px}
  .foot3 b{display:block;font:700 17px var(--head);font-variant-numeric:tabular-nums}
  .pos{color:var(--good)} .neg{color:var(--bad)}

  /* Goals */
  .goal h3{font:700 16px/1.3 var(--head);margin:0}
  .goal .top-l{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
  .goal .lbl{display:flex;justify-content:space-between;font-size:14px;margin:0 0 6px}
  .goal .lbl b{font-variant-numeric:tabular-nums}

  .note{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);padding:14px}
  .note button{margin-top:10px}
  .skel{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--line),color-mix(in srgb,var(--text) 10%,transparent),var(--line));background-size:200% 100%;animation:sh 1.4s infinite}
  @keyframes sh{to{background-position:-200% 0}}
  dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:var(--r);padding:20px;max-width:360px;width:calc(100% - 40px)}
  dialog::backdrop{background:rgba(0,0,0,.55)}
  dialog label{display:flex;align-items:center;gap:10px;padding:8px 0}
  [hidden]{display:none!important}

  @media(max-width:1100px){.row4{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}
  @media(max-width:900px){aside{display:none}.row3{grid-template-columns:1fr}.top{padding:0 16px}.content{padding:18px 16px;gap:22px}
    .r{grid-template-columns:minmax(0,1fr) 96px}.r>:nth-child(2),.r>:nth-child(4){display:none}.r .num{text-align:right}.r.h{display:none}
    .r.h+.r{border-top:0}.r>:last-child{grid-column:1/-1;justify-self:start}.r>:last-child:empty{display:none}}
  @media(max-width:520px){.row4{grid-template-columns:1fr 1fr;gap:10px}.stat .v{font-size:21px}.top h1 small,#customise span{display:none}}
  @media(prefers-reduced-motion:reduce){.skel{animation:none}.bar>i{transition:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="shell">
  <aside>
    <a class="brand" href="#overview" style="color:inherit;text-decoration:none">
      <span class="mark" id="mark">E</span>
      <span><b id="bizSide">Founder dashboard</b><span class="eyebrow">Dashboard</span></span>
    </a>
    <nav id="nav"></nav>
    <div class="side-foot">Reads your tools only. Nothing is sent or changed.</div>
  </aside>
  <div class="main">
    <header class="top">
      <h1 id="overview">Overview<small id="today"></small></h1>
      <span class="demo" id="demoTag" hidden>Example data</span>
      <button id="customise" type="button"><svg class="i" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor"><path d="M40,88H73a32,32,0,0,0,62,0h81a8,8,0,0,0,0-16H135a32,32,0,0,0-62,0H40a8,8,0,0,0,0,16Zm64-24A16,16,0,1,1,88,80,16,16,0,0,1,104,64ZM216,168H199a32,32,0,0,0-62,0H40a8,8,0,0,0,0,16h97a32,32,0,0,0,62,0h17a8,8,0,0,0,0-16Zm-48,24a16,16,0,1,1,16-16A16,16,0,0,1,168,192Z"/></svg><span>Modules</span></button>
      <button id="refresh" class="primary" type="button"><svg class="i" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor"><path d="M224,48V96a8,8,0,0,1-8,8H168a8,8,0,0,1,0-16h28.69L182.06,73.37a79.56,79.56,0,0,0-56.13-23.43h-.45A79.52,79.52,0,0,0,69.59,72.71,8,8,0,0,1,58.41,61.27a96,96,0,0,1,135,.79L208,76.69V48a8,8,0,0,1,16,0ZM186.41,183.29a80,80,0,0,1-112.47-.66L59.31,168H88a8,8,0,0,0,0-16H40a8,8,0,0,0-8,8v48a8,8,0,0,0,16,0V179.31l14.63,14.63A95.43,95.43,0,0,0,130,222.06h.53a95.36,95.36,0,0,0,67.07-27.33,8,8,0,0,0-11.18-11.44Z"/></svg>Refresh</button>
    </header>
    <main class="content">
      <div class="row4" id="strip"></div>
      <div class="row3" id="needs"></div>
      <div id="mods"></div>
    </main>
  </div>
</div>
<dialog id="modDlg">
  <strong>Show on my dashboard</strong>
  <div id="modList"></div>
  <p class="meta">Only changes this device. To add a new module, ask Claude.</p>
  <button id="modsClose" type="button">Done</button>
</dialog>

<!-- CONFIG: Claude fills this from the founder's brain and connected tools. JSON only. -->
<script type="application/json" id="config">
{
  "business": "EXAMPLE Business",
  "demo": true,
  "currency": "AUD",
  "brand": { "bg": "#111214", "panel": "#191A1D", "text": "#F3F3F1", "muted": "#9C9EA4", "accent": "#E8893F" },
  "modules": { "leads": true, "week": true, "money": true, "goals": true },
  "sources": {
    "leads": [
      { "server": "GHL", "tool": "opportunities_search-opportunity", "input": { "locationId": "LOCATION_ID", "query_status": "open", "query_limit": 50 }, "adapter": "ghlOpportunities" }
    ],
    "week": [
      { "server": "Google Calendar", "tool": "list_events", "input": { "pageSize": 50, "orderBy": "startTime", "startTime": "{now}", "endTime": "{in7days}" }, "adapter": "googleCalendar" }
    ],
    "money": [
      { "server": "Xero", "tool": "get_cash_position", "input": { "organisation_id": "ORG_ID" }, "adapter": "xeroCash" },
      { "server": "Xero", "tool": "get_profit_and_loss", "input": { "organisation_id": "ORG_ID", "start_date": "{monthStart}", "end_date": "{today}" }, "adapter": "xeroMonth" }
    ]
  },
  "goals": [
    { "title": "EXAMPLE: 20 new clients this quarter", "current": 11, "goal": 20, "target": "9 more by 31 March", "status": "on_track" },
    { "title": "EXAMPLE: $60k revenue this quarter", "current": 28400, "goal": 60000, "money": true, "target": "Need $3.2k a week", "status": "behind" },
    { "title": "EXAMPLE: new website live", "target": "Built in Level 3", "status": "done" }
  ]
}
</script>

<script>
/* ADAPTERS: turn each tool's answer into the shape a module draws. Claude adds one when a founder uses a
   different tool, after looking at one real answer from that tool in the founder's own session.
   Shapes:  leads -> {open, value, items:[{name, stage, value, updated, followUp}]}
            week  -> {events:[{title, start, end, allDay}], tasks:[{title, due}]}
            money -> any of {cash, income, spend, owedToYou, youOwe}  (numbers)
   Goals come from CONFIG: title, target (one line), status (on_track, behind, done, not_started),
   and optionally current + goal numbers (draws a progress bar; "money": true shows them as dollars). */
const num = (v) => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
const ADAPTERS = {
  // GoHighLevel, opportunities search. NOT yet checked against a live answer: check it on first build.
  ghlOpportunities(p) {
    const list = Array.isArray(p?.opportunities) ? p.opportunities : [];
    const week = Date.now() - 7 * 864e5;
    const items = list.map((o) => {
      const updated = Date.parse(o.lastStatusChangeAt || o.updatedAt || o.createdAt || '') || null;
      return { name: o.contact?.name || o.name || 'Unnamed', stage: o.pipelineStageName || o.stageName || '', value: num(o.monetaryValue),
               updated, followUp: !!updated && updated < week };
    }).sort((a, b) => (b.followUp - a.followUp) || ((a.updated || 0) - (b.updated || 0)));
    return { open: items.length, value: items.reduce((s, i) => s + i.value, 0), items };
  },
  // Google Calendar list_events. Checked 25 Nov 2026.
  googleCalendar(p) {
    const ev = Array.isArray(p?.events) ? p.events : [];
    return { events: ev.filter((e) => e.status !== 'cancelled').map((e) => ({
      title: e.summary || 'Busy', start: e.start?.dateTime || e.start?.date, end: e.end?.dateTime || e.end?.date, allDay: !e.start?.dateTime,
    })) };
  },
  // Xero get_cash_position. Checked 25 Nov 2026: amount_owed = owed to you, amount_due = you owe.
  xeroCash(p) { return { cash: num(p?.cash_balance), owedToYou: num(p?.amount_owed), youOwe: num(p?.amount_due) }; },
  // Xero get_profit_and_loss for this month. Checked 25 Nov 2026.
  xeroMonth(p) { const c = p?.current_pnl || {}; return { income: num(c.total_income) + num(c.total_other_income), spend: num(c.total_expenses) + num(c.total_cost_of_sales) }; },
};

/* DEMO: made-up numbers so the page can be seen before any tool is connected. */
const DEMO = {
  leads: () => ({ open: 6, value: 31400, items: [
    { name: 'Northside Physio', stage: 'Proposal sent', value: 12000, updated: Date.now() - 11 * 864e5, followUp: true },
    { name: 'Jordan Pike', stage: 'Quote sent', value: 6200, updated: Date.now() - 9 * 864e5, followUp: true },
    { name: 'Harbour Dental', stage: 'Quote sent', value: 7000, updated: Date.now() - 8 * 864e5, followUp: true },
    { name: 'Ella Hartigan', stage: 'Quote sent', value: 2400, updated: Date.now() - 3 * 864e5, followUp: false },
    { name: 'Mia Tran', stage: 'Site visit booked', value: 3800, updated: Date.now() - 2 * 864e5, followUp: false },
    { name: 'Sam & Lou Becker', stage: 'New enquiry', value: 0, updated: Date.now() - 864e5, followUp: false } ] }),
  week: () => { const d = (days, h, m = 0) => { const t = new Date(); t.setDate(t.getDate() + days); t.setHours(h, m, 0, 0); return t.toISOString(); };
    return { events: [
      { title: 'Site visit: Mia Tran', start: d(0, 9), end: d(0, 10) }, { title: 'Team check-in', start: d(0, 13), end: d(0, 13, 30) },
      { title: 'Quote follow-ups', start: d(1, 8), end: d(1, 9) }, { title: 'Supplier call', start: d(2, 11), end: d(2, 11, 30) },
      { title: 'Proposal walkthrough: Northside Physio', start: d(3, 15), end: d(3, 16) },
      { title: 'Day off', start: d(4, 0), end: d(5, 0), allDay: true } ],
      tasks: [{ title: 'Send Jordan the revised quote', due: d(0, 17) }, { title: 'Pay the ute rego', due: d(2, 17) }] }; },
  money: () => ({ cash: 31450, income: 18720, spend: 9310, owedToYou: 6400, youOwe: 2150 }),

const now = new Date();

const bar = (pct, warn) => { const b = el('div', warn ? 'bar warn' : 'bar'); const i = el('i'); i.style.width = `${Math.max(0, Math.min(100, pct))}%`; b.append(i); return b; };

// Brand
for (const [k, v] of Object.entries(CFG.brand || {})) if (/^#[0-9a-f]{3,8}$/i.test(v)) document.documentElement.style.setProperty(`--${k}`, v);
const biz = CFG.business || 'Founder dashboard';
$('bizSide').textContent = biz; $('mark').textContent = biz.replace(/^EXAMPLE\s+/i, '').trim().charAt(0).toUpperCase() || 'F';

  { id: 'leads', name: 'Leads and sales', group: 'Sales', icon: 'users-three' },

  { id: 'week', name: 'This week', group: 'Plan', icon: 'calendar-blank' },
  { id: 'goals', name: 'Goals', group: 'Plan', icon: 'target' },
];
const hidden = new Set(JSON.parse(localStorage.getItem('fd-hidden') || '[]'));

const DATA = {}; // merged data per module, for the headline strip

function buildNav() {
  const nav = $('nav'); nav.replaceChildren();
  const top = el('a', 'on'); top.href = '#overview'; top.append(icon('house'), el('span', null, 'Overview')); nav.append(top);
  const groups = new Map();
  for (const m of active()) { if (!groups.has(m.group)) groups.set(m.group, []); groups.get(m.group).push(m); }
  for (const [g, ms] of groups) {
    const box = el('div'); box.append(el('span', 'eyebrow', g));
    for (const m of ms) { const a = el('a'); a.href = `#m-${m.id}`; a.dataset.id = m.id; a.append(icon(m.icon), el('span', null, m.name)); box.append(a); }
    nav.append(box);
  }
}
function navCount(id, n) {
  const a = document.querySelector(`nav a[data-id="${id}"]`); if (!a) return;
  a.querySelector('.count')?.remove(); if (n > 0) a.append(el('span', 'count', n));
}

// One section per module
const cards = {};
function build() {
  buildNav();
  const host = $('mods'); host.replaceChildren(); host.style.cssText = 'display:flex;flex-direction:column;gap:28px';
  for (const m of active()) {
    const sec = el('section', 'mod'); sec.id = `m-${m.id}`; sec.setAttribute('aria-label', m.name);
    const head = el('div', 'mod-head'); const h = el('h2'); h.append(icon(m.icon), el('span', null, m.name));
    const pill = el('span', 'pill'); pill.hidden = true; h.append(pill);
    const fresh = el('span', 'fresh'); head.append(h, fresh);
    const body = el('div'); body.append(skeletonCard());
    sec.append(head, body); host.append(sec);
    cards[m.id] = { body, fresh, pill, parts: {}, errors: {} };
  }
  drawTop();
}
const skeletonCard = () => { const c = el('div', 'card'); c.style.cssText = 'display:grid;gap:10px'; for (const w of [55, 90, 72]) { const b = el('div', 'skel'); b.style.width = w + '%'; c.append(b); } return c; };
const setPill = (id, text) => { const p = cards[id]?.pill; if (!p) return; p.textContent = text; p.hidden = !text; };

// Headline strip + "needs you" cards, drawn from whatever has loaded so far
function drawTop() {
  const L = DATA.leads, M = DATA.money, W = DATA.week, on = (id) => !!cards[id];
  const goals = CFG.goals || [];
  const strip = $('strip'); strip.replaceChildren();
  const stat = (label, value, sub, to) => { const a = el('a', 'card stat'); a.href = to; a.append(el('div', 'eyebrow', label), el('div', 'v', value ?? '…'), el('div', 's', sub || ' ')); strip.append(a); };
  if (on('money')) stat('Cash in the bank', M && 'cash' in M ? money(M.cash) : null, M && 'owedToYou' in M ? `${money(M.owedToYou)} owed to you` : '', '#m-money');
  if (on('money')) stat('In this month', M && 'income' in M ? money(M.income) : null, M && 'spend' in M ? `${money(M.spend)} out` : '', '#m-money');
  if (on('leads')) stat('In the pipeline', L ? money(L.value) : null, L ? `${L.open} open deal${L.open === 1 ? '' : 's'}` : '', '#m-leads');
  if (on('week')) {
    const next = (W?.events || []).filter((e) => !e.allDay && when(e.end || e.start) > new Date()).sort((a, b) => when(a.start) - when(b.start))[0];
    const d = next && when(next.start);
    stat('Next up', W ? (next ? next.title : 'Nothing booked') : null, d ? `${ymd(d) === ymd(now) ? 'Today' : d.toLocaleDateString('en-AU', { weekday: 'long' })} · ${time(d)}` : '', '#m-week');
  }
  strip.hidden = !strip.children.length;

  const needs = $('needs'); needs.replaceChildren();
  const hl = (title, value, sub, ic, to) => { const a = el('a', 'card hl'); a.href = to; const g = el('div', 'grow'); g.append(el('div', 't', title), el('div', 'v', value ?? '…'), el('div', 'meta', sub || ' ')); const t = el('span', 'tile'); t.append(icon(ic)); a.append(g, t); needs.append(a); };
  if (on('leads')) { const f = (L?.items || []).filter((i) => i.followUp); hl('Need a follow-up', L ? String(f.length) : null, L ? (f.length ? `${money(f.reduce((s, i) => s + i.value, 0))} waiting on you` : 'Everyone is up to date') : '', 'bell', '#m-leads'); navCount('leads', f.length); }
  if (on('money')) hl('Bills to pay', M && 'youOwe' in M ? money(M.youOwe) : null, M && 'owedToYou' in M ? `${money(M.owedToYou)} coming in` : '', 'currency-circle-dollar', '#m-money');
  if (on('goals')) { const done = goals.filter((g) => g.status === 'done' || g.status === 'on_track').length; hl('Goals on track', `${done} / ${goals.length}`, goals.some((g) => g.status === 'behind') ? `${goals.filter((g) => g.status === 'behind').length} behind` : 'Nothing behind', 'target', '#m-goals'); }
  needs.hidden = !needs.children.length;
}

// Draw each module from its merged data
const DRAW = {
  leads(d, body) {
    setPill('leads', `${d.open ?? 0} open`);
    const card = el('div', 'card'); const rows = el('div', 'rows');
    const head = el('div', 'r h'); for (const t of ['Who', 'Stage', 'Value', 'Last moved', '']) head.append(el('span', null, t)); head.children[2].style.textAlign = 'right'; rows.append(head);
    for (const i of (d.items || []).slice(0, 8)) {
      const r = el('div', 'r');
      r.append(el('span', 'n', i.name), el('span', 'stage', i.stage || ''), el('span', 'num', i.value ? money(i.value) : ''), el('span', 'meta', i.updated ? ago(i.updated) : ''));
      const c = el('span'); if (i.followUp) { const ch = el('span', 'chip warn'); ch.append(icon('bell'), el('span', null, 'Follow up')); c.append(ch); } r.append(c);
      rows.append(r);
    }
    if (rows.children.length === 1) { const e = el('div', 'card'); e.append(el('p', 'meta', 'No open deals.')); body.replaceChildren(e); return; }

  },
  week(d, body) {

    const grid = el('div', 'split'); const cal = el('div', 'card'); const byDay = new Map();
    for (const e of evs) { const day = when(e.start); const k = ymd(day); if (!byDay.has(k)) byDay.set(k, { day, items: [] }); byDay.get(k).items.push(e); }
    for (const { day, items } of [...byDay.values()].slice(0, 6)) {
      const row = el('div', 'day'); const dt = el('div', ymd(day) === ymd(now) ? 'date today' : 'date');
      dt.append(el('span', null, ymd(day) === ymd(now) ? 'Today' : day.toLocaleDateString('en-AU', { weekday: 'short' })), el('b', null, day.getDate()));
      const list = el('div', 'evs'); for (const e of items) { const r = el('div', 'ev'); r.append(el('span', 'tm', e.allDay ? 'All day' : time(when(e.start))), el('span', 'tt', e.title)); list.append(r); }

    if (side.children.length === 1) side.append(el('p', 'meta', 'No tasks due. Connect a task app in Level 2 to see them here.'));
    grid.append(cal, side); body.replaceChildren(grid);
  },
  money(d, body) {
    const card = el('div', 'card'); const flow = el('div', 'flow');
    if ('income' in d || 'spend' in d) {
      const inc = d.income || 0, out = d.spend || 0, max = Math.max(inc, out, 1);
      const line = (label, v, warn) => { const w = el('div'); const l = el('div', 'lbl'); l.append(el('span', null, label), el('span', null, money(v))); w.append(l, bar(v / max * 100, warn)); return w; };
      if ('income' in d) flow.append(line('Money in this month', inc));
      if ('spend' in d) flow.append(line('Money out this month', out, out > inc));

    if ('cash' in d) cell('Cash in the bank', money(d.cash));

// Errors: each code has its own fix, shown in the module it affects
function problem(c, server, err, src) {
  const note = el('div', 'note');
  const say = {
    needs_reauth: `${server} needs reconnecting. In Claude: Settings, then Connectors, then ${server}.`,
    server_not_connected: `Connect ${server} in Claude (Settings, then Connectors) to see this.`,
    selection_required: `You have more than one ${server} connected. Choose one when Claude asks.`,
    not_in_manifest: `${server} is switched off for this dashboard. Turn it on in this page's permissions menu.`,
    blocked_by_policy: `${server} is blocked by your organisation's settings.`,
    approval_required: `This needs your OK to read ${server}.`,
  }[err.code] || `Couldn't load from ${server} just now. Press Refresh to try again.`;
  note.append(el('div', null, say));
  if (err.code === 'approval_required' && src) {
    const b = el('button', null, `Allow ${server}`);
    b.addEventListener('click', async () => { try { const r = await mcp.callTool(src.server, src.tool, fill(src.input)); take(c, src, r); } catch (e) { take(c, src, null, e); } });
    note.append(b);
  }
  return note;
}
const RETRACT = new Set(['needs_reauth', 'server_not_connected', 'blocked_by_policy', 'approval_required', 'not_in_manifest', 'selection_required']);

function take(id, src, result, err) {
  const c = cards[id]; if (!c) return;
  const key = `${src.server}:${src.tool}`;
  if (err) { c.errors[key] = { err, src }; if (RETRACT.has(err.code)) delete c.parts[key]; }
  else {
    delete c.errors[key];
    try { c.parts[key] = ADAPTERS[src.adapter](result.payload); }
    catch { c.errors[key] = { err: { code: 'adapter' }, src }; }
    c.fresh.textContent = result.cache?.storedAt ? `Updated ${time(new Date(result.cache.storedAt))}` : 'Live';
  }
  render(id);
}
function render(id) {
  const c = cards[id]; const parts = Object.values(c.parts);
  const merged = Object.assign({}, ...parts);
  if (id === 'week') { merged.events = parts.flatMap((p) => p.events || []); merged.tasks = parts.flatMap((p) => p.tasks || []); }
  DATA[id] = parts.length ? merged : undefined;
  const box = el('div'); box.style.cssText = 'display:grid;gap:12px';
  if (parts.length) { const inner = el('div'); DRAW[id](merged, inner); box.append(inner); }
  for (const { err, src } of Object.values(c.errors)) box.append(problem(id, src.server, err, src));
  c.body.replaceChildren(box.children.length ? box : skeletonCard());
  drawTop();
}

// Sidebar highlights the section in view
let spy = null;
function watchNav() {
  spy?.disconnect();
  spy = new IntersectionObserver((es) => { for (const e of es) if (e.isIntersecting) for (const a of document.querySelectorAll('nav a')) a.classList.toggle('on', a.getAttribute('href') === `#${e.target.id}`); }, { rootMargin: '-40% 0px -55% 0px' });
  for (const s of document.querySelectorAll('section.mod, #overview')) spy.observe(s);
}

// Data: demo, or the founder's own connectors
let mcp = null; const stops = [];
async function start() {
  for (const k of Object.keys(DATA)) delete DATA[k];
  build(); watchNav();
  if (cards.goals) { DRAW.goals(null, cards.goals.body); cards.goals.fresh.textContent = 'From your brain'; }
  if (CFG.demo) { for (const id of Object.keys(DEMO)) if (cards[id]) { DATA[id] = DEMO[id](); DRAW[id](DATA[id], cards[id].body); cards[id].fresh.textContent = 'Example'; } drawTop(); return; }
  mcp = await window.claude?.use?.('mcp');
  if (!mcp) { for (const id of ['leads', 'week', 'money']) if (cards[id]) { const n = el('div', 'note', 'Open this dashboard in Claude to see your live numbers.'); cards[id].body.replaceChildren(n); } return; }
  for (const id of ['leads', 'week', 'money']) {
    if (!cards[id]) continue;
    for (const src of CFG.sources?.[id] || []) {
      stops.push(mcp.watchTool(src.server, src.tool, fill(src.input), (ev) => ev.type === 'data' ? take(id, src, ev.result) : take(id, src, null, ev.error), { refetchInterval: 10 * 60 * 1000 }));
    }
  }
}
$('refresh').addEventListener('click', async () => { if (mcp) { try { await mcp.invalidate(); } catch { /* nothing cached */ } } else { stops.splice(0).forEach((s) => s()); start(); } });
$('customise').addEventListener('click', () => {
  const list = $('modList'); list.replaceChildren();
  for (const m of MODULES.filter((x) => CFG.modules?.[x.id])) {
    const lab = el('label'); const box = el('input'); box.type = 'checkbox'; box.checked = !hidden.has(m.id);
    box.addEventListener('change', () => { box.checked ? hidden.delete(m.id) : hidden.add(m.id); localStorage.setItem('fd-hidden', JSON.stringify([...hidden])); stops.splice(0).forEach((s) => s()); start(); });
    lab.append(box, el('span', null, m.name)); list.append(lab);
  }
  $('modDlg').showModal();
});
$('modsClose').addEventListener('click', () => $('modDlg').close());
start();
</script>
